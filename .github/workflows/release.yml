name: Release
# Tag a version (v1.0.0) and this builds the archives bin/build produces
# locally, then attaches them — plus checksums.txt — to the GitHub release
# the install script downloads from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build release archives
        run: bin/build "${GITHUB_REF_NAME#v}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "work $GITHUB_REF_NAME" \
            --generate-notes
